name: iPhone app (trial build)

# With the App Store Connect secrets (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID): signs the iPhone app and
# uploads it to TestFlight (build number = run number + 100). Without them: builds it unsigned and publishes
# ontime-prayer.ipa for Sideloadly. macOS minutes cost ~10x Linux, so it runs only in the private repo and only
# when the iPhone app or the shared page changes (or by hand).
on:
  push:
    branches: [app]
    paths: ['ios/**', 'android/app/src/main/assets/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # «[skip ios]» in the commit message: a change to the shared page that needs no iPhone build yet (Android first)
    if: github.repository == 'tswq-dev/umm-al-qura-prayer-times' && !contains(github.event.head_commit.message, '[skip ios]')
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect accepts only apps built with the iOS 26 SDK or later (Xcode 26+; iOS 27 SDK from April 2027)
      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_[0-9]*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version

      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate

      # With the App Store Connect secrets: sign and upload to TestFlight. Without them: the old unsigned .ipa.
      - name: Signing (certificate and profiles from the App Store Connect API)
        if: env.ASC_KEY_ID != ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography || pip3 install --quiet pyjwt cryptography
          python3 ios/ci/asc.py setup com.itqan.ontime com.itqan.ontime.widgets
          security create-keychain -p ci ci.keychain
          security set-keychain-settings -lut 3600 ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import cert.p12 -k ci.keychain -P "$(grep '^P12_PASS=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci ci.keychain >/dev/null
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          rm cert.p12

      - name: Build and upload to TestFlight
        if: env.ASC_KEY_ID != ''
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # a clean PEM (the secret may carry Windows line endings or spaces from Notepad, which Xcode rejects)
          python3 -c 'import os,re,textwrap; b="".join(re.findall(r"[A-Za-z0-9+/=]+", re.sub(r"-----[^-]+-----", "", os.environ["ASC_KEY_P8"]))); print("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(b, 64)) + "\n-----END PRIVATE KEY-----")' > "$RUNNER_TEMP/AuthKey.p8"
          BUILD=$(( ${{ github.run_number }} + 100 ))
          cd ios
          set -o pipefail
          xcodebuild archive -project OnTime.xcodeproj -scheme OnTime -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OnTime.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            CI_PROFILE_APP="$PROFILE_0" CI_PROFILE_WIDGET="$PROFILE_1" CURRENT_PROJECT_VERSION=$BUILD 2>&1 \
            | tee build.log | grep -E "error:|warning: .*(OnTime|OnTimeWidgets|Shared)/|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build.log
          # the versions that go up (App Store Connect wants each build number higher than the last)
          for p in "$RUNNER_TEMP"/OnTime.xcarchive/Products/Applications/*.app/Info.plist "$RUNNER_TEMP"/OnTime.xcarchive/Products/Applications/*.app/PlugIns/*.appex/Info.plist; do
            echo "$p: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$p") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$p"))"; done
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.itqan.ontime</key><string>$PROFILE_0</string>
              <key>com.itqan.ontime.widgets</key><string>$PROFILE_1</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OnTime.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee -a build.log | tail -25
          echo "Uploaded build $BUILD (version $(grep MARKETING_VERSION project.yml | grep -o '[0-9.]*')) to TestFlight."

      - name: Remove the signing certificate
        if: always() && env.ASC_KEY_ID != ''
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 ios/ci/asc.py cleanup com.itqan.ontime com.itqan.ontime.widgets || true
          security delete-keychain ci.keychain 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Build for iPhone (unsigned)
        if: env.ASC_KEY_ID == ''
        shell: bash
        run: |
          cd ios
          xcodebuild -project OnTime.xcodeproj -target OnTime -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: .*(OnTime|OnTimeWidgets|Shared)/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
          mkdir -p Payload && cp -R build/Release-iphoneos/OnTime.app Payload/
          ls Payload/OnTime.app/PlugIns
          # ad-hoc signatures that carry the App Group, so the installer that re-signs can keep it for the widgets
          codesign -f -s - --entitlements OnTimeWidgets/OnTimeWidgets.entitlements Payload/OnTime.app/PlugIns/OnTimeWidgets.appex || true
          codesign -f -s - --entitlements OnTime/OnTime.entitlements Payload/OnTime.app || true
          zip -qry ../ontime-prayer.ipa Payload

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log
          retention-days: 3

      - uses: softprops/action-gh-release@v2
        if: env.ASC_KEY_ID == ''
        with:
          tag_name: ios-${{ github.run_number }}
          name: "الفجر الصادق آيفون - نسخة تجريبية ${{ github.run_number }}"
          body: "ملف ontime-prayer.ipa غير موقّع: ثبّته على الآيفون ببرنامج Sideloadly وحساب Apple العادي (يحتاج إعادة تثبيت كل 7 أيام)."
          files: ontime-prayer.ipa
          prerelease: true
