name: Android first-use test (emulator)

# By hand (a push of app to the "e2e" branch): builds the trial APK, runs a whole first use of it on an emulator (tools/e2e/android_e2e.py) and puts the
# pictures and steps.md on the "e2e-shots" branch.
on:
  push:
    branches: [e2e]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon -q && cp app/build/outputs/apk/debug/app-debug.apk ../ontime-prayer.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: pip install websocket-client
      - name: First use on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -timezone Asia/Riyadh -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/e2e/android_e2e.py ontime-prayer.apk out || true
      - name: Publish pictures
        if: always()
        run: |
          mkdir -p out && cd out && git init -q -b e2e-shots && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "run ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" e2e-shots
