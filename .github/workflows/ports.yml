name: ports
on:
  push:
    paths: ['ports/**', 'js/umq.js', 'data/**', 'Package.swift', 'jitpack.yml', '.github/workflows/ports.yml']
  pull_request:
    paths: ['ports/**', 'js/umq.js', 'data/**', 'Package.swift', 'jitpack.yml', '.github/workflows/ports.yml']
  workflow_dispatch:
jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Kotlin compiler
        run: curl -sSL -o k.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip && unzip -q k.zip
      - name: Generated port is up to date
        run: python3 ports/gen.py && git diff --exit-code ports/
      - name: Every server value, exactly the 67 known mismatches
        run: |
          ./kotlinc/bin/kotlinc ports/kotlin/UmmAlQura.kt ports/kotlin/Verify.kt -include-runtime -d verify.jar
          zcat data/vectors.csv.gz | java -jar verify.jar | python3 ports/check.py
      - name: Library package builds (what JitPack runs)
        run: |
          cd ports/kotlin && ./gradlew --no-daemon -q publishToMavenLocal
          unzip -l ~/.m2/repository/com/github/tswq-dev/ontime-prayer/1.0.0/ontime-prayer-1.0.0.jar | grep 'org/ontimeprayer/UmmAlQura.class'
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Every server value, exactly the 67 known mismatches
        run: |
          swiftc --version
          swiftc -O ports/swift/UmmAlQura.swift ports/swift/Verify/main.swift -o verify
          zcat data/vectors.csv.gz | ./verify | python3 ports/check.py
      - name: Swift package builds
        run: swift build
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Every server value, exactly the 67 known mismatches
        run: |
          (cd ports/dart && dart pub get && dart compile exe bin/verify.dart -o ../../verify)
          zcat data/vectors.csv.gz | ./verify | python3 ports/check.py
