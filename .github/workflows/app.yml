name: Android app (trial build)

on:
  push:
    branches: [app]
    paths: ['android/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ontime-prayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ontime-prayer-apk
          path: ontime-prayer.apk
      # Trial builds are released only from the private repo, so the public one stays clean.
      - uses: softprops/action-gh-release@v2
        if: github.repository == 'tswq-dev/umm-al-qura-prayer-times'
        with:
          tag_name: app-${{ github.run_number }}
          name: "على وقتها - نسخة تجريبية ${{ github.run_number }}"
          body: "حمّل ملف ontime-prayer.apk وثبّته على جوال أندرويد."
          files: ontime-prayer.apk
          prerelease: true
