# «الركن الثاني» on iPhone: a native shell for the same page as Android (android/app/src/main/assets/www),
# with local notifications for the adhan. Generate the Xcode project with `xcodegen generate`.
# CI signs for TestFlight with profiles it makes itself (ios/ci/asc.py) and passes their names as CI_PROFILE_*.
name: OnTime
options:
  bundleIdPrefix: com.itqan
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.21.0"
    CURRENT_PROJECT_VERSION: "32"
targets:
  OnTime:
    type: application
    platform: iOS
    sources:
      # Swift, the asset catalog, the notification clips (Sounds/*.caf, at most 30 s) and the full recordings (Full/*.m4a)
      - path: OnTime
      - path: Shared
      - path: ../android/app/src/main/assets/www
        type: folder
        buildPhase: resources
      - path: ../android/app/src/main/assets/wfonts
        type: folder
        buildPhase: resources
      - path: ../android/app/src/main/res/raw/adhan_afasy.mp3
        buildPhase: resources
      - path: ../android/app/src/main/res/raw/adhan_afasy_fajr.mp3
        buildPhase: resources
      - path: ../android/app/src/main/res/raw/adhan_qatami.mp3
        buildPhase: resources
      - path: ../android/app/src/main/res/raw/adhan_takbir_afasy.mp3
        buildPhase: resources
      - path: ../android/app/src/main/res/raw/adhan_takbir_qatami.mp3
        buildPhase: resources
    # a shared scheme, for `xcodebuild archive` on CI
    scheme: {}
    dependencies:
      - target: OnTimeWidgets
    entitlements:
      path: OnTime/OnTime.entitlements
      properties:
        com.apple.security.application-groups: [group.com.itqan.ontime]
    info:
      path: OnTime/Info.plist
      properties:
        CFBundleDisplayName: الركن الثاني
        CFBundleDevelopmentRegion: ar
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.itqan.ontime.refresh]
        NSLocationWhenInUseUsageDescription: نحدد مدينتك من موقعك لنحسب أوقات الصلاة بدقة. الموقع يبقى على جوالك.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itqan.ontime
        PROVISIONING_PROFILE_SPECIFIER: $(CI_PROFILE_APP)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  # Home screen and lock screen widgets (WidgetKit). They read the month of days the page sends (`widgetData`)
  # from the App Group, and never compute prayer times themselves.
  OnTimeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OnTimeWidgets
      - path: Shared
      - path: ../android/app/src/main/assets/wfonts/kufi.ttf
        buildPhase: resources
      - path: ../android/app/src/main/assets/wfonts/ruqaa.ttf
        buildPhase: resources
      - path: ../android/app/src/main/assets/wfonts/naskh.ttf
        buildPhase: resources
      - path: ../android/app/src/main/assets/wfonts/plex400.ttf
        buildPhase: resources
      - path: ../android/app/src/main/assets/wfonts/plex600.ttf
        buildPhase: resources
    entitlements:
      path: OnTimeWidgets/OnTimeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.itqan.ontime]
    info:
      path: OnTimeWidgets/Info.plist
      properties:
        CFBundleDisplayName: الركن الثاني
        CFBundleDevelopmentRegion: ar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itqan.ontime.widgets
        PROVISIONING_PROFILE_SPECIFIER: $(CI_PROFILE_WIDGET)
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
