<style>
/* الهوية: «المحراب» — زمرد، نحاس، رمل نجدي، ورق، طين. الخطوط: ريم كوفي للاسم والعناوين، IBM Plex Sans Arabic للنص (OFL، في مجلد fonts). */
@font-face{font-family:"Reem Kufi";src:url(fonts/reem-kufi.woff) format("woff");font-weight:400 700;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/plex-400.woff) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Arabic";src:url(fonts/plex-600.woff) format("woff");font-weight:600 700;font-display:swap}
:root{--bg:#EFE7D8;--card:#FBF8F2;--ink:#1F2A24;--mute:#6E6352;--line:#DCD2BF;--acc:#0B4D3B;--acc2:#E3EDE6;--onacc:#FFFFFF;--brass:#C99A4B;--band:#0B4D3B;--bandink:#F6EFE1;--sun:#EFE7D8;--warn:#9A5B00}
:root{color-scheme:light}
:root[data-theme=dark]{--bg:#101A16;--card:#17241F;--ink:#ECE4D4;--mute:#A99F8B;--line:#2A3833;--acc:#D3A75A;--acc2:#22312A;--onacc:#13201B;--brass:#D3A75A;--band:#0A3328;--bandink:#F1E8D6;--sun:#F1E8D6;--warn:#E0A84F;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101A16;--card:#17241F;--ink:#ECE4D4;--mute:#A99F8B;--line:#2A3833;--acc:#D3A75A;--acc2:#22312A;--onacc:#13201B;--brass:#D3A75A;--band:#0A3328;--bandink:#F1E8D6;--sun:#F1E8D6;--warn:#E0A84F;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Plex Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:12px 16px 16px}
.band{background:var(--band);color:var(--bandink)}
.band .in{max-width:860px;margin:0 auto;padding:14px 16px 16px;display:flex;align-items:center;gap:14px}
.band svg{width:46px;height:47px;flex:none;color:var(--brass)}
.band h1{margin:0;font:600 32px/1.2 "Reem Kufi","Plex Arabic",sans-serif;letter-spacing:0}
.band p{margin:0;font-size:13px;line-height:1.5;opacity:.82}
.band .in{position:relative}.band h1{padding-inline-end:96px}html[dir=ltr] .band h1{font-size:26px;white-space:nowrap}
.band .tools{position:absolute;top:14px;inset-inline-end:16px;display:flex;gap:6px}
.pill{background:transparent;color:var(--bandink);border:1px solid rgba(246,239,225,.45);border-radius:999px;padding:3px 12px;font-size:14px;line-height:1.5}.pill.icon{padding:3px 7px;display:grid;place-items:center}.pill svg{width:18px;height:18px;display:block}
.nav h2,h3{font-family:"Reem Kufi","Plex Arabic",sans-serif;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{cursor:pointer}
input:focus-visible,button:focus-visible{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;padding:8px 12px}.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--acc2);color:var(--acc);font-weight:600}
[hidden]{display:none!important}.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.err{color:var(--warn);font-size:14px;width:100%}
#crow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}#crow[hidden]{display:none}
.cl{display:grid;gap:2px;min-width:0}.cl input{width:100%;min-width:0}.cl span{font-size:13px;color:var(--mute)}#cgo,#cerr{grid-column:1/-1}
.r1{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.combo{position:relative;min-width:0}.combo input{width:100%}
.dd{position:relative;min-width:0}
.ddi{width:100%;padding-inline-end:28px;text-overflow:ellipsis}.ddi[aria-expanded=true]{border-color:var(--acc)}
.dd .chev{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mute);display:flex}
.list{position:absolute;inset-inline:0;top:calc(100% + 6px);z-index:10;margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.14);max-height:min(320px,55vh);overflow-y:auto;overscroll-behavior:contain}
.list[hidden]{display:none}
.list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.list li small{color:var(--mute);font-size:13px;font-weight:400}
.list li[aria-selected=true]{background:var(--acc2);color:var(--acc);font-weight:600}
@media (hover:hover){.list li:not(.none):hover{background:var(--acc2)}}
.list li.none{color:var(--mute);cursor:default}
.ctl{display:grid;gap:8px}
.seg.fill{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}.seg.fill button{text-align:center;white-space:nowrap;padding-inline:6px}
.drow{display:grid;grid-template-columns:76px minmax(0,1fr) 108px;gap:8px}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:359px){
  .band .in{gap:10px;padding:12px 12px 14px}.band svg{width:38px;height:39px}.band h1{font-size:26px}html[dir=ltr] .band h1{font-size:22px}
  .band .in{flex-wrap:wrap;row-gap:4px}.band .in>div:not(.tools){flex:1;min-width:0}.band .tools{position:static;order:-1;width:100%;justify-content:flex-end}.band h1,html[dir=ltr] .band h1{padding-inline-end:0}main{padding:10px 10px 14px}.card{padding:10px}
  .r1{grid-template-columns:1fr 1fr}.r1 .combo{grid-column:1/-1}
  .drow{grid-template-columns:62px minmax(0,1fr) 86px}.prefs{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}.p b{font-size:21px}.nav .ib{width:36px;height:36px}.nav h2{font-size:18px}.date1{font-size:14px}
}
.pr{text-align:center;margin-top:16px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}.nav .mid{flex:1;text-align:center;min-width:0}
.nav h2{margin:0;font-size:20px;line-height:1.3}.date1{font-weight:600;font-size:15px;line-height:1.45}
.ib{flex:none;width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%;color:var(--acc)}
.go{margin-top:6px;padding:3px 14px;font-size:14px;color:var(--acc);border-color:var(--acc);border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}
.p b{display:block;font-size:23px;line-height:1.35;font-variant-numeric:tabular-nums}.p em{display:block;font-style:normal;font-size:13px;font-variant-numeric:tabular-nums}.p>span{color:var(--mute);font-size:14px}
.p b small{font-size:14px;color:var(--mute);margin-inline-start:4px}
.p.next>span,.p.next b,.p.next b small,.p.next em{color:var(--onacc)}
.p.next{border-color:var(--acc);background:var(--acc)}
.meta{color:var(--mute);font-size:14px}
.left{text-align:center;margin-top:10px;color:var(--acc)}.left b{direction:ltr;display:inline-block}
/* month and year tables: a rounded frame that scrolls inside, so the prayer-name row and the day column stay in view */
.tw{overflow:auto;max-height:calc(100svh - 40px);border:1px solid var(--line);border-radius:14px;background:var(--card);overscroll-behavior:auto}
.mt{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;font-variant-numeric:tabular-nums;--zebra:color-mix(in srgb,var(--card) 60%,var(--bg))}
.mt th,.mt td{padding:9px 11px;text-align:center;white-space:nowrap;background:var(--card);border-bottom:1px solid var(--line)}
.mt th{position:sticky;top:0;z-index:2;color:var(--mute);font-weight:600;font-size:14px;border-bottom:2px solid var(--line)}
.mt th:first-child,.mt td:first-child{position:sticky;inset-inline-start:0;z-index:1;font-weight:600;border-inline-end:1px solid var(--line)}
.mt th:first-child{z-index:3}
html[dir=rtl] .mt th:first-child,html[dir=rtl] .mt td:first-child{box-shadow:-6px 0 8px -6px rgba(0,0,0,.18)}html[dir=ltr] .mt th:first-child,html[dir=ltr] .mt td:first-child{box-shadow:6px 0 8px -6px rgba(0,0,0,.18)}
.mt td:nth-child(3){color:var(--mute);font-size:14px}.mt td.wk{font-size:14px}.mt tr.fri td.wk{color:var(--brass);font-weight:600}
.mt tbody tr:nth-child(even) td{background:var(--zebra)}
.mt tbody tr:last-child td{border-bottom:0}
.mt tr.fri td:first-child{color:var(--brass)}
.mt tr.today td{background:var(--acc2)}.mt tr.today td:first-child{color:var(--acc)}
tr[data-d]{cursor:pointer}@media (hover:hover){tr[data-d]:hover td{background:var(--acc2)}}
.mon h3{margin:18px 2px 8px;color:var(--acc);font-size:19px}.mon:first-of-type h3{margin-top:6px}
a{color:var(--acc)}
.near{background:var(--acc2);border:1px solid var(--line);border-radius:12px;padding:12px}.near p{margin:0 0 10px;font-weight:600}
.nearb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nearb button{white-space:normal;line-height:1.35}.near small{display:block;margin-top:8px;color:var(--mute)}
.inst{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:10px;background:var(--band);color:var(--bandink);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
.inst span{flex:1;font-size:14px;line-height:1.5}.inst .pri{background:var(--brass);border-color:var(--brass);color:#13201B;font-weight:600}.inst .x{background:transparent;border:0;color:var(--bandink);font-size:22px;padding:2px 8px}
@page{size:A4;margin:12mm}
@media print{html:root:root{--bg:#fff;--card:#fff;--ink:#1F2A24;--mute:#5E5648;--line:#CFC6B4;--acc:#0B4D3B;--acc2:#E9F0EB;--onacc:#fff;--brass:#8F6420;color-scheme:light}.tw{max-height:none;overflow:visible}.mt{font-size:11pt}.mt th,.mt td{padding:4px 6px;position:static}.mon{break-inside:avoid}.noprint{display:none!important}body{background:#fff}.card{border:none;padding:0}.band{background:none;color:#0B4D3B}.band p{display:none}.p.next{background:none}.p.next span,.p.next b{color:inherit}}

function showInstall() { if (standalone || instSeen()) return; $('#inst').hidden = false; installText(); }
function hideInstall(remember) { $('#inst').hidden = true; if (remember) try { localStorage.setItem('ontime-prayer-install', 'x'); } catch (e) {} }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; setTimeout(showInstall, 1500); });
addEventListener('appinstalled', () => hideInstall(true));
$('#instgo').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); const c = await deferredInstall.userChoice; deferredInstall = null; hideInstall(c.outcome === 'accepted'); };
$('#instx').onclick = () => hideInstall(true);
if (isIOS && !standalone) setTimeout(showInstall, 2500);
// manual coordinates (decimal degrees; north and east positive). "21.426666, 39.831666" pasted in one box also works.
const cnum = t => { t = digits(t).replace(/٫/g, '.').trim(); return /^[-+]?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN; };
$('#cbtn').onclick = () => { const r = $('#crow'), open = r.hidden; r.hidden = !open; $('#cbtn').setAttribute('aria-expanded', open);
  if (open) { $('#clat').value = st.lat; $('#clon').value = st.lon; $('#cerr').hidden = true; $('#clat').focus(); $('#clat').select(); } };
function applyCoords() {
  let a = $('#clat').value, b = $('#clon').value; const two = digits(a).split(/[\s,،؛;]+/).filter(Boolean);
  if (two.length === 2) { a = two[0]; b = two[1]; }
  const lat = cnum(a), lon = cnum(b), err = $('#cerr');
  if (!(Math.abs(lat) <= 90) || !(Math.abs(lon) <= 180)) { err.textContent = T.coordErr; err.hidden = false; return; }
  Object.assign(st, { lat: UMQ.siteCoordinate(lat), lon: UMQ.siteCoordinate(lon), kind: 'coord' });
  inp.value = placeName(); save(); render(); $('#crow').hidden = true; $('#cbtn').setAttribute('aria-expanded', 'false'); }
$('#cgo').onclick = applyCoords;
$('#clat').onkeydown = $('#clon').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); applyCoords(); } };
// moving between days/months/years: arrows, "back to today", tapping a table row, swipe (day view), keyboard arrows
const out = $('#out');
out.onclick = e => { if (e.target.closest('[data-print]')) return window.print(); const g = e.target.closest('[data-go]'); if (g) { if (+g.dataset.go) return step(+g.dataset.go); st.view = 'day'; updView(); return setDate(todayRiyadh()); }
  const r = e.target.closest('tr[data-d]'); if (r) { st.view = 'day'; updView(); setDate(r.dataset.d); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
let tx = null;
out.addEventListener('touchstart', e => { tx = st.view === 'day' && e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, { passive: true });
out.addEventListener('touchend', e => { if (!tx) return; const dx = e.changedTouches[0].clientX - tx[0], dy = e.changedTouches[0].clientY - tx[1]; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy)) step((dx > 0) === (T.dir === 'rtl') ? 1 : -1); });   // like turning a page in the reading direction
document.addEventListener('keydown', e => { if (e.target.closest('input,.dd') || e.altKey || e.ctrlKey || e.metaKey) return;
  const fwd = T.dir === 'rtl' ? 'ArrowLeft' : 'ArrowRight', bwd = T.dir === 'rtl' ? 'ArrowRight' : 'ArrowLeft';
  if (e.key === fwd) step(1); else if (e.key === bwd) step(-1); });
let lastToday = todayRiyadh();
st.date = lastToday; applyLang();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
setInterval(() => { const t = todayRiyadh(); if (t !== lastToday) { if (st.date === lastToday) st.date = t; lastToday = t; setPicker(); }
  if (st.view === 'day') render(); }, 30000);
</script>
</body>
